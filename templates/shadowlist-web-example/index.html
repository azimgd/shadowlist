<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShadowList Web</title>
    <script type="importmap">
      {
        "imports": {
          "shadowlist-wasm": "../../packages/shadowlist-wasm/dist/index.js"
        }
      }
    </script>
    <style>
      :root {
        --background: #ffffff;
        --surface: #f2f2f7;
        --text: #1c1c1e;
        --secondary: #6e6e73;
        --separator: rgba(60, 60, 67, 0.18);
        --accent: #0a84ff;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #000000;
          --surface: #1c1c1e;
          --text: #f2f2f7;
          --secondary: #98989f;
          --separator: rgba(84, 84, 88, 0.6);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--text);
        font:
          15px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      #routes {
        display: flex;
        gap: 4px;
        padding: 8px 12px;
        overflow-x: auto;
        border-bottom: 1px solid var(--separator);
      }

      #routes a {
        padding: 6px 12px;
        border-radius: 16px;
        color: var(--text);
        text-decoration: none;
        white-space: nowrap;
      }

      #routes a.active {
        background: var(--accent);
        color: #ffffff;
      }

      #screen {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 12px;
      }

      .toolbar:empty {
        display: none;
      }

      .toolbar button {
        padding: 6px 10px;
        border: 1px solid var(--separator);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .list {
        flex: 1;
        min-height: 0;
      }

      .banner {
        padding: 24px 16px;
        background: var(--surface);
        font-weight: 600;
      }

      .feed-cell {
        padding: 12px 16px;
        border-bottom: 1px solid var(--separator);
        background: var(--background);
      }

      .feed-header {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .avatar {
        display: grid;
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 20px;
        color: #ffffff;
        font-weight: 600;
        place-items: center;
      }

      .name {
        font-weight: 600;
      }

      .meta {
        color: var(--secondary);
        font-size: 13px;
      }

      .text {
        margin: 8px 0 0;
      }

      .chat-cell {
        display: flex;
        padding: 4px 12px;
      }

      .chat-cell.own {
        justify-content: flex-end;
      }

      .bubble {
        max-width: 75%;
        padding: 8px 12px;
        border-radius: 18px;
        background: var(--surface);
      }

      .chat-cell.own .bubble {
        background: var(--accent);
        color: #ffffff;
      }

      .tile-cell {
        padding: 10px;
        border: 3px solid var(--background);
        border-radius: 12px;
        color: #1c1c1e;
        font-weight: 600;
      }

      .header-cell {
        padding: 8px 16px;
        background: var(--surface);
        color: var(--secondary);
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <nav id="routes"></nav>
    <main id="screen"></main>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
