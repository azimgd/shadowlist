apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "shadowlist.example"
    defaultConfig {
        applicationId "shadowlist.example"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        /*
         * -PshadowlistFrameTrace compiles the list trace into a release build, for the
         * [SLC] commit counter of shadowlist-core-bench/perf-suite.sh. Debug builds always have it.
         */
        if (project.hasProperty("shadowlistFrameTrace")) {
            externalNativeBuild {
                cmake {
                    cppFlags "-DSHADOWLIST_FRAME_TRACE_COMPILED=1"
                }
            }
        }
        /*
         * -PshadowlistDebugLog compiles in the core's [SL] debug log, read with adb logcat -s SL.
         * It is off by default because it prints on every pass.
         */
        if (project.hasProperty("shadowlistDebugLog")) {
            externalNativeBuild {
                cmake {
                    arguments "-DSHADOWLIST_DEBUG_LOG=1"
                }
            }
        }
        /*
         * -PshadowlistScrollBand=false turns off the offset band. The list then sends a state
         * update every scroll frame. Android apps get no launch environment. The
         * SHADOWLIST_SCROLL_BAND define is the only switch there (ShadowListViewState.h).
         */
        if ((findProperty("shadowlistScrollBand") ?: "true").toString() == "false") {
            externalNativeBuild {
                cmake {
                    cppFlags "-DSHADOWLIST_SCROLL_BAND=0"
                }
            }
        }
        /*
         * React Native engine flags that make list commits cheaper, see MainApplication.kt.
         * Build with -PshadowlistEngineFlags=false for an A/B run with React Native's own flags,
         * and -PshadowlistCommitBranching=true to also try the experimental commit flags.
         */
        buildConfigField "boolean", "SHADOWLIST_ENGINE_FLAGS", (findProperty("shadowlistEngineFlags") ?: "true").toString()
        buildConfigField "boolean", "SHADOWLIST_COMMIT_BRANCHING", (findProperty("shadowlistCommitBranching") ?: "false").toString()
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            /*
             * Caution! In production, you need to generate your own keystore file.
             * see https://reactnative.dev/docs/signed-apk-android.
             */
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
