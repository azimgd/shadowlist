name: Setup
description: Setup Node.js and install workspace dependencies from the repo root

inputs:
  working-directory:
    description: Where the repo is checked out
    default: .

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.working-directory }}/.nvmrc

    - name: Cache dependencies
      id: yarn-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/**/node_modules
          ${{ inputs.working-directory }}/.yarn/install-state.gz
        key: ${{ runner.os }}-yarn-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Install dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      working-directory: ${{ inputs.working-directory }}
      run: yarn install --immutable
      shell: bash
