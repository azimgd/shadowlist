name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn workspace shadowlist run test --maxWorkers=2 --coverage

      - name: Run utils unit tests
        run: yarn workspace shadowlist-utils run test --maxWorkers=2

  test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shadowlist-core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core tests
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      - name: Run core tests (ThreadSanitizer)
        run: |
          cmake -S . -B build-tsan -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan
          ./build-tsan/shadowlist_core_tests

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn workspace shadowlist run prepare

      # The tarball must carry the built JS, the types and the vendored core, and no tests or build output.
      - name: Check package contents
        working-directory: packages/shadowlist-fabric
        run: |
          npm pack --dry-run --ignore-scripts > "$RUNNER_TEMP/pack.txt" 2>&1
          for f in lib/module/index.js lib/typescript/src/index.d.ts shadowlist-core/Container.cpp shadowlist-core/sources.cmake scripts/vendor-core.js ShadowList.podspec react-native.config.js android/shadowlist/jni/CMakeLists.txt; do
            grep -q " $f\$" "$RUNNER_TEMP/pack.txt" || { echo "missing $f"; exit 1; }
          done
          if grep -qE "__tests__|/build/|\.test\." "$RUNNER_TEMP/pack.txt"; then
            echo "tests or build output in the package"
            exit 1
          fi

      # Its declarations build against the fabric package's lib/typescript output.
      - name: Build utils package
        run: yarn workspace shadowlist-utils run build

  build-android-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shadowlist-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-kit-${{ hashFiles('packages/shadowlist-android/gradle/wrapper/gradle-wrapper.properties', 'packages/shadowlist-android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-kit-

      - name: Build ShadowListKit
        run: ./gradlew --no-daemon --console=plain :ShadowListKit:assembleRelease

  build-ios-kit:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The Swift package at the repo root, the way apps that add it by URL build it.
      - name: Build ShadowListKit with SwiftPM
        run: >-
          xcodebuild -scheme ShadowListKit
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the library
        run: yarn workspace shadowlist run prepare

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('templates/shadowlist-fabric-example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn workspace shadowlist-example run build:android

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the library
        run: yarn workspace shadowlist run prepare

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: templates/shadowlist-fabric-example

      - name: Cache cocoapods
        uses: actions/cache@v4
        with:
          path: |
            templates/shadowlist-fabric-example/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('templates/shadowlist-fabric-example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Build example for iOS
        run: yarn workspace shadowlist-example run build:ios --force-pods

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: templates/shadowlist-fabric-example
      - name: Install macOS pods
        working-directory: templates/shadowlist-macos-example/macos
        env:
          BUNDLE_GEMFILE: ../../shadowlist-fabric-example/Gemfile
        run: bundle exec pod install --deployment
      - name: Build macOS example
        working-directory: templates/shadowlist-macos-example/macos
        run: >-
          xcodebuild -workspace ShadowListMacOS.xcworkspace
          -scheme ShadowListMacOS-macOS -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
