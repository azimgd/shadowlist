name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          working-directory: packages

      - name: Lint files
        run: make lint

      - name: Check formatting
        run: make format-check

      - name: Typecheck files
        run: make typecheck

      - name: Check README links, requirements and examples
        run: make docs-check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          working-directory: packages

      - name: Run unit tests
        working-directory: packages
        run: yarn workspace shadowlist run test --maxWorkers=2 --coverage

  test-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shadowlist-core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core tests
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Run core tests
        run: ctest --test-dir build --output-on-failure

      # The fuzz tests run on one thread and are left out here. The step above runs them.
      - name: Run core tests (ThreadSanitizer)
        run: |
          cmake -S . -B build-tsan -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          cmake --build build-tsan
          SLT_SKIP=fuzz_ ./build-tsan/shadowlist_core_tests

  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          working-directory: packages

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7

      - name: Build wasm package
        run: make build-wasm

      - name: Run wasm tests
        run: make test-wasm

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          working-directory: packages

      - name: Build package
        run: make build

      - name: Check package contents
        working-directory: packages/shadowlist-fabric
        run: |
          npm pack --dry-run --ignore-scripts > "$RUNNER_TEMP/pack.txt" 2>&1
          for f in lib/module/index.js lib/typescript/src/index.d.ts shadowlist-core/Container.cpp shadowlist-core/sources.cmake scripts/vendor-core.js ShadowList.podspec react-native.config.js android/shadowlist/jni/CMakeLists.txt; do
            grep -q " $f\$" "$RUNNER_TEMP/pack.txt" || { echo "missing $f"; exit 1; }
          done
          if grep -qE "__tests__|/build/|\.test\." "$RUNNER_TEMP/pack.txt"; then
            echo "tests or build output in the package"
            exit 1
          fi

  build-android-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shadowlist-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-kit-${{ hashFiles('packages/shadowlist-android/gradle/wrapper/gradle-wrapper.properties', 'packages/shadowlist-android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-kit-

      - name: Build ShadowListKit
        run: ./gradlew --no-daemon --console=plain :ShadowListKit:assembleRelease

  build-ios-kit:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build ShadowListKit with SwiftPM
        run: >-
          xcodebuild -scheme ShadowListKit
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build

  # The example apps live in the templates repository. The app jobs check out the engine and
  # the templates side by side, the layout both repositories default to. SHADOWLIST_ROOT tells
  # the templates where the engine is. The apps build the engine from its sources: Metro takes
  # the source entry, the podspec copies the core itself and Android compiles the canonical
  # core. They need neither the engine's dependencies nor its lib/ build.
  build-android:
    runs-on: ubuntu-latest
    env:
      SHADOWLIST_ROOT: ${{ github.workspace }}/shadowlist
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: shadowlist

      - name: Checkout templates
        uses: actions/checkout@v4
        with:
          repository: komplete-io/shadowlist-templates
          path: shadowlist-templates

      - name: Setup templates
        uses: ./shadowlist/.github/actions/setup
        with:
          working-directory: shadowlist-templates

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('shadowlist-templates/examples/shadowlist-fabric-example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        working-directory: shadowlist-templates
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn workspace shadowlist-example run build:android

  build-ios:
    runs-on: macos-15
    env:
      SHADOWLIST_ROOT: ${{ github.workspace }}/shadowlist
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: shadowlist

      - name: Checkout templates
        uses: actions/checkout@v4
        with:
          repository: komplete-io/shadowlist-templates
          path: shadowlist-templates

      - name: Setup templates
        uses: ./shadowlist/.github/actions/setup
        with:
          working-directory: shadowlist-templates

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: shadowlist-templates/examples/shadowlist-fabric-example

      - name: Cache cocoapods
        uses: actions/cache@v4
        with:
          path: |
            shadowlist-templates/examples/shadowlist-fabric-example/ios/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('shadowlist-templates/examples/shadowlist-fabric-example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Build example for iOS
        working-directory: shadowlist-templates
        run: yarn workspace shadowlist-example run build:ios --force-pods

  build-macos:
    runs-on: macos-15
    env:
      SHADOWLIST_ROOT: ${{ github.workspace }}/shadowlist
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: shadowlist

      - name: Checkout templates
        uses: actions/checkout@v4
        with:
          repository: komplete-io/shadowlist-templates
          path: shadowlist-templates

      - name: Setup templates
        uses: ./shadowlist/.github/actions/setup
        with:
          working-directory: shadowlist-templates

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: shadowlist-templates/examples/shadowlist-fabric-example

      - name: Install macOS pods
        working-directory: shadowlist-templates/examples/shadowlist-macos-example/macos
        env:
          BUNDLE_GEMFILE: ../../shadowlist-fabric-example/Gemfile
        run: bundle exec pod install --deployment

      - name: Build macOS example
        working-directory: shadowlist-templates/examples/shadowlist-macos-example/macos
        run: >-
          xcodebuild -workspace ShadowListMacOS.xcworkspace
          -scheme ShadowListMacOS-macOS -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
