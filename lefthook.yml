# The yarn workspace root is packages/. Jobs with root: packages/ run there and get staged
# paths relative to it. The format job runs from the repo root because it also checks docs/,
# .github/ and root files.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      root: packages/
      glob: '*.{js,cjs,mjs,ts,tsx}'
      run: yarn eslint --no-warn-ignored --max-warnings 0 {staged_files}
    - name: format
      glob: '*.{js,cjs,mjs,ts,tsx,json,md,yml,yaml}'
      run: packages/node_modules/.bin/prettier --check --config packages/.prettierrc --ignore-path .gitignore --ignore-path packages/.prettierignore {staged_files}

pre-push:
  jobs:
    - name: typecheck
      root: packages/
      run: yarn typecheck
