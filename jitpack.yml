# JitPack builds the Android kit from packages/shadowlist-android and serves it as
# com.github.azimgd.shadowlist:shadowlist-kit:<tag>.
jdk:
  - openjdk17
before_install:
  - yes | sdkmanager --licenses > /dev/null || true
  - yes | sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
install:
  - cd packages/shadowlist-android && ./gradlew --no-daemon --console=plain :ShadowListKit:publishToMavenLocal
